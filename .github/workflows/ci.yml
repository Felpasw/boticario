name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate
      - name: Build shared
        run: pnpm --filter shared build
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate
      - name: Build shared
        run: pnpm --filter shared build
      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      MAC_HASH_SECRET: ci-test-secret
      INGEST_API_KEY: ci-test-ingest-key
      INGEST_USER_EMAIL: admin@boticario.local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm --filter shared build
      - name: Apply Prisma migrations
        run: pnpm --filter api exec prisma migrate deploy
      - name: Unit tests
        run: pnpm test
      - name: E2E tests
        run: pnpm --filter api test:e2e

  build:
    runs-on: ubuntu-latest
    needs: [typecheck]
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3333
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      MAC_HASH_SECRET: ci-e2e-secret
      INGEST_API_KEY: ci-e2e-ingest-key
      INGEST_USER_EMAIL: admin@boticario.local
      SEED_ADMIN_EMAIL: admin@boticario.local
      SEED_ADMIN_PASSWORD: change-me-dev
      SEED_ADMIN_NAME: Admin
      NEXT_PUBLIC_API_URL: http://localhost:3333
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Build shared
        run: pnpm --filter shared build
      - name: Apply Prisma migrations
        run: pnpm --filter api exec prisma migrate deploy
      - name: Seed admin user
        run: pnpm --filter api db:seed
      - name: Seed connections
        run: pnpm --filter api db:seed:connections
      - name: Build web
        run: pnpm --filter web build
      - name: Start API
        run: pnpm --filter api start > /tmp/api.log 2>&1 &
      - name: Start web
        run: pnpm --filter web start > /tmp/web.log 2>&1 &
      - name: Wait for API and web
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3333/health > /dev/null && curl -sf http://localhost:3000 > /dev/null; then
              echo "services up"
              exit 0
            fi
            sleep 2
          done
          echo "services never came up" >&2
          tail -n 100 /tmp/api.log /tmp/web.log
          exit 1
      - name: Run Playwright
        run: pnpm --filter web e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
